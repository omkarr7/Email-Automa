name: Public Evidence Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "18 4 * * 1,4"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: public-evidence-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
      GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run public evidence discovery
        run: python -m src.discovery

      - name: Upload discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: |
            data/discovered_evidence.csv
            data/evidence.db
          if-no-files-found: warn

      - name: Persist state back to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: persist discovery state"
          git push
