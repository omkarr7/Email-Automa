name: Followups

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Keep follow-up generation in dry run mode"
        required: false
        default: "true"
  schedule:
    - cron: "12 5 * * 1-5"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: followups
  cancel-in-progress: false

jobs:
  monitor-and-nudge:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      SEND_ENABLED: ${{ secrets.SEND_ENABLED || 'false' }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
      GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
      NUDGE_AFTER_DAYS: ${{ secrets.NUDGE_AFTER_DAYS || '6' }}
      DAILY_NUDGE_LIMIT: ${{ secrets.DAILY_NUDGE_LIMIT || '3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Materialize Gmail OAuth files
        if: ${{ env.GMAIL_CREDENTIALS_JSON != '' }}
        run: |
          mkdir -p data
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials.json
          if [ -n "$GMAIL_TOKEN_JSON" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > data/gmail_token.json
          fi

      - name: Monitor inbox threads
        if: ${{ env.GMAIL_ADDRESS != '' }}
        run: python -m src.main --mode monitor

      - name: Generate or send nudges
        run: python -m src.main --mode nudge

      - name: Upload followup state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followup-state-${{ github.run_id }}
          path: |
            data/outreach.db
            data/evidence.db
          if-no-files-found: warn

      - name: Persist state back to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: persist followup state"
          git push
